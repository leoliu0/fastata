[package]
name = "fastata"
description = "Stata plugin (SPI 3.0) behind fastata, fast drop-in versions of official Stata data commands"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Leo Liu <auleo.liu@gmail.com>"]
repository = "https://github.com/leoliu0/fastata"
publish = false

[lib]
name = "fastata"
crate-type = ["cdylib"]

[build-dependencies]
cc = "1"

# Test-only (MemIo string columns); the shipped plugin has no runtime dependencies.
[dev-dependencies]
parking_lot = "0.12"

# Shipped plugin and benchmarks: maximum optimisation.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
