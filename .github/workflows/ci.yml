name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            targets: ""
          - os: macos-15
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-2025
            targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    # Third-party actions are pinned to commit SHAs (the tag each one had is in the comment).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}

      - name: Versions agree (Linux)
        if: runner.os == 'Linux'
        run: sh scripts/check-versions.sh

      - name: fastata.pkg lists every ado and help file (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          diff <(cd stata && ls *.ado *.sthlp 2>/dev/null | sort) <(awk '$1 == "f" {print $2}' stata/fastata.pkg | sort)

      - name: Rust tests
        run: cargo test --release

      - name: Build plugin
        shell: bash
        run: scripts/build_plugin.sh

      - name: Exported symbols (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          nm -D --defined-only stata/fastata.plugin | awk '{print $3}' | grep -v '^$' | sort > target/exports.txt
          cat target/exports.txt
          grep -qx pginit target/exports.txt
          grep -qx stata_call target/exports.txt
          test "$(wc -l < target/exports.txt)" -eq 2

      - name: Mock host (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cc -O2 -DSYSTEM=OPUNIX -Ic tests/mockhost/mockhost.c -ldl -lm -o target/mockhost
          target/mockhost stata/fastata.plugin

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Mock host (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /O2 /DSYSTEM=STWIN32 /Ic tests\mockhost\mockhost.c /Fe:target\mockhost.exe
          target\mockhost.exe stata\fastata.plugin
