name: release

# Tag vX.Y.Z: builds and smoke-tests the plugin for Linux, macOS and Windows, assembles the Stata
# net-install tree and zip, publishes the tree at the root of the gh-pages branch (GitHub Pages:
#   net install fastata, from("https://leoliu0.github.io/fastata")
# ) and a GitHub Release with the zip.
# Manual runs (workflow_dispatch) default to dry_run: everything is built and tested, nothing is
# published. Publishing also requires a tag ref, so a branch run never publishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and smoke-test every artifact without publishing anything
        type: boolean
        default: true

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (the tag each one had is in the comment): the
# publish job can write to the repository and gh-pages.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag, Cargo and ado versions agree
        id: check
        run: |
          version=$(sh scripts/check-versions.sh ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }})
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release version $version"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal

      - name: Build
        run: |
          . "$HOME/.cargo/env"
          cargo build --release
          cp target/release/libfastata.so fastata.linux64.plugin

      - name: glibc floor (<= 2.28)
        run: |
          max=$(objdump -T fastata.linux64.plugin | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol: $max"
          test "$(printf '%s\nGLIBC_2.28\n' "$max" | sort -V | tail -1)" = "GLIBC_2.28"

      - name: Mock host
        run: |
          cc -O2 -DSYSTEM=OPUNIX -Ic tests/mockhost/mockhost.c -ldl -lm -o target/mockhost
          target/mockhost ./fastata.linux64.plugin

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-linux
          path: fastata.linux64.plugin

  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build universal plugin
        run: |
          MACOSX_DEPLOYMENT_TARGET=11.0 cargo build --release --target aarch64-apple-darwin
          MACOSX_DEPLOYMENT_TARGET=10.13 cargo build --release --target x86_64-apple-darwin
          lipo -create -output fastata.macos-universal.plugin \
            target/aarch64-apple-darwin/release/libfastata.dylib \
            target/x86_64-apple-darwin/release/libfastata.dylib
          codesign --force -s - fastata.macos-universal.plugin
          lipo -info fastata.macos-universal.plugin

      - name: Mock host (arm64)
        run: |
          mkdir -p target
          cc -O2 -DSYSTEM=OPUNIX -Ic tests/mockhost/mockhost.c -o target/mockhost
          target/mockhost ./fastata.macos-universal.plugin

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-macos
          path: fastata.macos-universal.plugin

  windows:
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Build
        shell: bash
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          cp target/x86_64-pc-windows-msvc/release/fastata.dll fastata.win64.plugin

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Mock host
        shell: cmd
        run: |
          cl /nologo /O2 /DSYSTEM=STWIN32 /Ic tests\mockhost\mockhost.c /Fe:target\mockhost.exe
          target\mockhost.exe fastata.win64.plugin

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-windows
          path: fastata.win64.plugin

  stata-dist:
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: plugin-*
          path: artifacts
          merge-multiple: true

      - name: Assemble net-install tree
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist/stata
          cp stata/*.ado stata/*.sthlp stata/stata.toc dist/stata/
          sed "s/^d Distribution-Date: .*/d Distribution-Date: $(date -u +%Y%m%d)/" stata/fastata.pkg > dist/stata/fastata.pkg
          cp artifacts/fastata.linux64.plugin artifacts/fastata.macos-universal.plugin artifacts/fastata.win64.plugin dist/stata/
          ls -l dist/stata
          (cd dist && zip -r "../fastata-v${VERSION}-stata.zip" stata)
          unzip -l "fastata-v${VERSION}-stata.zip" | grep -c -E 'fastata\.(linux64|macos-universal|win64)\.plugin$' | grep -qx 3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stata-net-install
          path: dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stata-zip
          path: fastata-v${{ needs.version.outputs.version }}-stata.zip

  publish:
    needs: [version, stata-dist]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stata-net-install
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stata-zip
          path: release

      # The net-install files sit at the site root, so the from() URL is the bare Pages URL.
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist/stata
          keep_files: false

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
